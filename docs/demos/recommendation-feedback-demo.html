<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>AI 建议评价卡片 Demo</title>
    <style>
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        background: #f7f6f4;
        color: #132038;
        font-family: "LXGW WenKai", "Kaiti SC", KaiTi, serif;
      }
      .screen {
        width: 430px;
        min-height: 820px;
        padding: 18px 16px 32px;
      }
      .card {
        padding: 24px;
        border-radius: 24px;
        background: #fff;
        box-shadow: 0 10px 30px rgba(45, 41, 38, 0.07);
      }
      .header {
        display: flex;
        align-items: center;
        justify-content: space-between;
      }
      .title {
        display: flex;
        align-items: center;
        gap: 9px;
        font-size: 18px;
        font-weight: 700;
      }
      .robot {
        width: 28px;
        height: 28px;
      }
      .source {
        padding: 4px 9px;
        border-radius: 5px;
        background: #f4e8dc;
        color: #746456;
        font-size: 10px;
      }
      .outfit {
        margin-top: 18px;
        padding: 18px;
        border: 1px solid #e8eaed;
        border-radius: 17px;
        background: #f8f9fa;
      }
      .eyebrow,
      .section-title {
        color: #8c96a8;
        font-size: 11px;
        font-weight: 700;
      }
      .summary {
        margin-top: 8px;
        font-size: 15px;
        font-weight: 700;
        line-height: 1.7;
      }
      .section {
        margin-top: 18px;
      }
      .copy {
        margin: 7px 0 0;
        color: #7e889b;
        font-size: 12px;
        line-height: 1.8;
      }
      .tips {
        padding-top: 18px;
        margin-top: 18px;
        border-top: 1px dashed #e4e6ea;
      }
      .tips ul {
        padding-left: 18px;
        margin: 8px 0 0;
        color: #7e889b;
        font-size: 12px;
        line-height: 1.8;
      }
      .refresh {
        width: 100%;
        height: 44px;
        margin-top: 20px;
        border: 1px solid #dfe3e8;
        border-radius: 999px;
        background: #fff;
        color: #344054;
        font: inherit;
        font-size: 14px;
        font-weight: 700;
      }
      .feedback {
        padding-top: 20px;
        margin-top: 20px;
        border-top: 1px solid #edf0f3;
        text-align: center;
      }
      .feedback-title {
        margin: 0;
        color: #263449;
        font-size: 15px;
        font-weight: 700;
      }
      .feedback-subtitle {
        margin: 6px 0 14px;
        color: #99a2b1;
        font-size: 11px;
      }
      .ratings {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 9px;
      }
      .rating {
        height: 42px;
        border: 1px solid #dfe3e8;
        border-radius: 12px;
        background: #fff;
        color: #536176;
        font: inherit;
        font-size: 12px;
        font-weight: 700;
      }
      .rating span {
        margin-right: 5px;
        font-family: sans-serif;
        font-size: 15px;
      }
      .rating.helpful {
        border-color: #b9dec8;
        background: #effaf3;
        color: #18844a;
      }
      .saved {
        margin-top: 11px;
        color: #8c96a8;
        font-size: 10px;
      }
    </style>
  </head>
  <body>
    <main class="screen">
      <section class="card">
        <div class="header">
          <div class="title">
            <svg
              class="robot"
              viewBox="0 0 32 32"
              fill="none"
              aria-hidden="true"
            >
              <path
                d="M16 7V4.8"
                stroke="#000"
                stroke-width="2"
                stroke-linecap="round"
              />
              <circle
                cx="16"
                cy="3.8"
                r="1.8"
                fill="#f2b66d"
                stroke="#000"
                stroke-width="1.4"
              />
              <rect
                x="5.5"
                y="8"
                width="21"
                height="18"
                rx="5"
                fill="#f7fbff"
                stroke="#000"
                stroke-width="2"
              />
              <path
                d="M5.5 14H4.3A2.3 2.3 0 0 0 2 16.3v2.4A2.3 2.3 0 0 0 4.3 21h1.2M26.5 14h1.2a2.3 2.3 0 0 1 2.3 2.3v2.4a2.3 2.3 0 0 1-2.3 2.3h-1.2"
                fill="#d8e9f7"
                stroke="#000"
                stroke-width="1.8"
              />
              <circle cx="11.7" cy="16" r="2" fill="#000" />
              <circle cx="20.3" cy="16" r="2" fill="#000" />
              <circle cx="11.1" cy="15.4" r=".55" fill="#fff" />
              <circle cx="19.7" cy="15.4" r=".55" fill="#fff" />
              <path
                d="M11.5 21c1.2 1.05 2.7 1.55 4.5 1.55s3.3-.5 4.5-1.55"
                stroke="#000"
                stroke-width="1.8"
                stroke-linecap="round"
              />
            </svg>
            AI 智能穿衣建议
          </div>
          <span class="source">通用策略</span>
        </div>
        <div class="outfit">
          <div class="eyebrow">今日穿配叠穿方案</div>
          <div class="summary">
            【增加保暖层】舒适随行叠穿：轻便西装外套 / 针织开衫 + 长袖棉质 T 恤
            + 经典牛仔裤 / 直筒西裤。
          </div>
        </div>
        <div class="section">
          <div class="section-title">气温与层叠逻辑依据</div>
          <p class="copy">
            当前气温约为
            18°C，室外宜人。空调通透的办公室里，长期久坐容易产生凉意，多备一件薄外套至关重要。
          </p>
        </div>
        <div class="tips">
          <div class="section-title">全天通勤细节贴士</div>
          <ul>
            <li>早晚体感偏冷，建议比平常多带一件保暖马甲或稍厚一些的外套。</li>
            <li>棉质长袖 T 恤兼具透气与保暖，适合作为核心内搭。</li>
          </ul>
        </div>
        <button class="refresh">↻&nbsp; 重新分析今日搭配</button>
        <div class="feedback">
          <p class="feedback-title">这条穿衣建议对你有帮助吗？</p>
          <p class="feedback-subtitle">你的评价会帮助我们持续优化建议</p>
          <div class="ratings">
            <button class="rating helpful"><span>👍</span>有帮助</button>
            <button class="rating"><span>●</span>一般</button>
            <button class="rating"><span>👎</span>没帮助</button>
          </div>
          <div class="saved">已选择“有帮助” · 可随时修改</div>
        </div>
      </section>
    </main>
  </body>
</html>
