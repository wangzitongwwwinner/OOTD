<style>
        /* Custom Checkbox Logic */
        input[type="checkbox"]:checked + .check-icon {
            opacity: 1;
        }
        
        @keyframes shimmer {
            100% {
                transform: skew(-12deg) translateX(200%);
            }
        }
    </style>
<script>
        // Simple interaction for the checkbox to ensure users tick it before clicking login
        document.addEventListener('DOMContentLoaded', () => {
            const wechatBtn = document.querySelector('button.bg-\\[\\#07C160\\]');
            const phoneBtn = document.querySelector('button.glass-panel');
            const checkbox = document.getElementById('terms-checkbox');
            const label = document.querySelector('label[for="terms-checkbox"]');

            const handleLoginClick = (e) => {
                if (!checkbox.checked) {
                    e.preventDefault();
                    // Shake animation on the label to indicate error
                    label.animate([
                        { transform: 'translateX(0)' },
                        { transform: 'translateX(-5px)' },
                        { transform: 'translateX(5px)' },
                        { transform: 'translateX(-5px)' },
                        { transform: 'translateX(5px)' },
                        { transform: 'translateX(0)' }
                    ], {
                        duration: 400,
                        easing: 'ease-in-out'
                    });
                    label.classList.add('text-error-container');
                    setTimeout(() => label.classList.remove('text-error-container'), 1000);
                } else {
                    // Proceed with login logic
                    const btn = e.currentTarget;
                    btn.classList.add('opacity-80', 'scale-95');
                    setTimeout(() => btn.classList.remove('opacity-80', 'scale-95'), 200);
                }
            };

            wechatBtn.addEventListener('click', handleLoginClick);
            phoneBtn.addEventListener('click', handleLoginClick);
        });
    </script>
