name: Quality

on:
  pull_request:
  push:
    branches:
      - main
      - 'codex/**'

permissions:
  contents: read

concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.19.2'
          cache: npm
          cache-dependency-path: |
            package-lock.json
            miniprogram/package-lock.json
            packages/contracts/package-lock.json
            cloudfunctions/api/package-lock.json

      - name: Install root dependencies
        run: npm ci

      - name: Install miniprogram dependencies
        run: npm ci
        working-directory: miniprogram

      - name: Install contract dependencies
        run: npm ci
        working-directory: packages/contracts

      - name: Install cloud function dependencies
        run: npm ci
        working-directory: cloudfunctions/api

      - name: Run quality gate
        run: npm run quality
